<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zomato Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
        }

        /* Header */
        header {
            background: #e23744;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        /* Search */
        .search-box {
            text-align: center;
            margin: 20px;
        }

        .search-box input {
            width: 60%;
            padding: 10px;
            font-size: 16px;
        }

        /* Restaurant Cards */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            width: 250px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 150px;
        }

        .card h3 {
            margin: 10px;
        }

        .card p {
            margin: 10px;
            color: gray;
        }

        .btn {
            background: #e23744;
            color: white;
            border: none;
            padding: 10px;
            margin: 10px;
            width: 90%;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background: #c72c3a;
        }
    </style>
</head>
<body>

<header>
    Zomato Clone 🍔
</header>

<div class="search-box">
    <input type="text" placeholder="Search for restaurants or food...">
</div>

<div class="container">

    <!-- Card 1 -->
    <div class="card">
        <img src="https://source.unsplash.com/250x150/?pizza">
        <h3>Pizza Hut</h3>
        <p>Pizza, Fast Food</p>
        <button class="btn">Order Now</button>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <img src="https://source.unsplash.com/250x150/?burger">
        <h3>Burger King</h3>
        <p>Burgers, Snacks</p>
        <button class="btn">Order Now</button>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <img src="https://source.unsplash.com/250x150/?biryani">
        <h3>Biryani House</h3>
        <p>Biryani, Indian</p>
        <button class="btn">Order Now</button>
    </div>

</div>

</body>
</html>
